services:
  # Python Flask Backend API Service
  - type: web
    name: bloodbank-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: bloodbank
      - key: DB_PORT
        value: "3306"
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false

  # React Frontend Static Site Service
  - type: web
    name: bloodbank-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false
